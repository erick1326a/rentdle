<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Guesser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Rent Guesser</h1>
        <div id="difficulty-selector">
            <label for="difficulty">Difficulty: </label>
            <select id="difficulty">
                <option value="100">Easy (±€100)</option>
                <option value="50" selected>Normal (±€50)</option>
                <option value="25">Hard (±€25)</option>
            </select>
        </div>
        <button id="restart-test" style="background-color: #f44336; margin-top: 15px; padding: 8px 16px;">Restart Game (Test)</button>
    </header>
    <main>
        <div id="clue-container">
            <div id="clue-content"></div>
            <div id="clue-nav">
                <button id="prev-clue" disabled>&lt; Prev</button>
                <span id="clue-tracker">Clue 1</span>
                <button id="next-clue" disabled>Next &gt;</button>
            </div>
        </div>
        
        <div id="guess-section">
            <input type="number" id="guess-input" placeholder="Enter rent in €">
            <button id="submit-guess">Guess</button>
            <button id="skip-clue" style="background-color: #555;">Skip</button>
        </div>

        <div id="history-container"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
